    source: "camino_rojo_fs_2021, cash-flow table p. 22-13: NET REVENUE less silver payable ounces x US$20 (derived; refining charges stay with gold)"
  after_tax:
    values: [115879.1, 98354.7, 100968.7, 108348.7, 78648.2, 81687.9, 60518.2, 54893.2, 61070.1, 34477.3, 13356.3, -6915.1, -5500.3, -6472.0]
