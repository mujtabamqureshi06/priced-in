# Gold Standard Ventures (#75, ADR 0044). Money in US$ thousands unless stated.
# Documents are those public on the valuation date (ADR 0007). The only later document,
# Orla's Q3 2022 statements, is used for one market observation on the date: the fair
# value of the shares issued at closing.

