  linked_share: {value: 0.025, source: "camino_rojo_fs_2021, p. 22-14: 2.0% royalty and 0.5% extraordinary mining duty on revenue"}
  tax_rate: {value: 0.3525, source: "Mexican special mining duty 7.5% plus 30% income tax on the remainder: 0.075 + 0.30 x 0.925"}
  check: >-
    The annual after-tax row discounted at 5% from Year -1 gives US$471.6 million
    (end-year) or US$487.4 million (mid-year), against the published US$452 million.
    The study states that capital already spent is in Year -1 undiscounted but does not
    give its timing convention, so the published NPV is not reproduced. Only flows after
    the valuation date are used here.

