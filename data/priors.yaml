# Priors registry. Every assumption the engine uses, with its source and status.
# Schema and rules: src/pricedin/priors.py. Status codes: docs/sources.md.
# Entries are added only with a source and a location; see docs/calibration.md.

priors:
  - id: stage.pfs_to_fs
    description: Probability that a project at PFS stage advances to a feasibility study.
    distribution: {kind: fixed, value: 0.82}
    units: probability
    applies_to: {stage: PFS}
    source: Sykes and Trench (2014), as reported in Lopatnikov and Rumyantsev (2025)
    location: Lopatnikov and Rumyantsev (2025), Mining Science and Technology 10(3), Table 1
    status: V
    flag: >-
      Cross-sectional count ratio, global copper; used as a stand-in for a
      conversion rate.
    sensitivity:
      - {label: stress low, value: 0.50, source: judgment}
      - {label: stress high, value: 0.95, source: judgment}
    decision: ADR 0013
    notes: >-
      Ratio of project counts at PFS and FS at one point in time (92 and 75),
      not a tracked conversion rate.

  - id: stage.fs_to_build
    description: >-
      Probability that a project at FS stage reaches a construction decision.
      One combined gate covering permitting, financing and the decision itself.
    distribution: {kind: fixed, value: 0.88}
    units: probability
    applies_to: {stage: FS}
    source: Sykes and Trench (2014), as reported in Lopatnikov and Rumyantsev (2025)
    location: Lopatnikov and Rumyantsev (2025), Mining Science and Technology 10(3), Table 1
    status: V
    flag: >-
      Cross-sectional count ratio, global copper; used as a stand-in for a
      conversion rate. Applied unchanged to permitted or financed cases, which
      probably understates their odds.
    sensitivity:
      - {label: AMC failure rate, value: 0.75, source: "AMC (McCarthy), Why feasibility studies fail", status: P}
      - {label: stress low, value: 0.50, source: judgment}
      - {label: stress high, value: 0.95, source: judgment}
    decision: ADR 0013
    notes: >-
      Ratio of producing or constructing projects (66) to FS-stage projects (75)
      at one point in time. Replaced by the Phase 4 cohort when available.

  - id: capex.overrun.fs
    description: >-
      Ratio of as-built capital cost (nominal US$) to the bankable feasibility
      study estimate (real US$, including contingency). Drawn once per path.
    distribution: {kind: shifted_lognormal, mu: -1.495821, sigma: 0.944456, shift: 0.91}
    units: nominal capital cost ratio (as-built / FS estimate)
    applies_to: {stage: FS}
    source: Bertisen and Davis (2008), The Engineering Economist 53(2):118-139, doi:10.1080/00137910802058533
    location: p. 122 (fitted shifted lognormal) and p. 134, Equation (7)
    status: V
    flag: >-
      Sample of 63 externally financed projects (46 completed 1995-2001 plus 17
      from Castle 1985), all built; bankable-feasibility estimates only.
    decision: ADR 0007 (real terms; apply capex.inflation_adjustment)
    notes: >-
      The paper reports the lognormal component by its mean (0.35) and standard
      deviation (0.42), as fitted in @RISK. mu and sigma here are the equivalent
      parameters of the underlying normal: sigma^2 = ln(1 + (0.42/0.35)^2),
      mu = ln(0.35) - sigma^2/2. Fitted mean ratio 1.26; sample mean 1.25,
      median 1.16, SD 0.30, range 0.93 to 2.14 (Table 1). Gold projects were not
      statistically different (p. 129). A size-dependent version exists
      (Equation 9) and is not used by default.

  - id: capex.inflation_adjustment
    description: >-
      Factor converting the nominal capital cost ratio to real terms, so the
      overrun is applied consistently with the engine's real-terms convention.
    distribution: {kind: fixed, value: 0.914}
    units: dimensionless multiplier
    source: Bertisen and Davis (2008), The Engineering Economist 53(2):118-139
    location: p. 123
    status: V
    flag: >-
      The authors' own assumption: 3% a year cost inflation, two years from study
      to construction start, two years of construction. Gives a real mean
      overrun of about 14%.
    sensitivity:
      - {label: no inflation adjustment, value: 1.0, source: judgment}
    decision: ADR 0007, ADR 0015

  - id: capex.overrun.pfs
    description: >-
      Capital cost ratio applied to a PFS estimate. Same distribution as
      capex.overrun.fs; there is no verified source for PFS-stage overruns.
    distribution: {kind: shifted_lognormal, mu: -1.495821, sigma: 0.944456, shift: 0.91}
    units: nominal capital cost ratio (as-built / study estimate)
    applies_to: {stage: PFS}
    source: Bertisen and Davis (2008), The Engineering Economist 53(2):118-139, doi:10.1080/00137910802058533
    location: p. 122 and p. 134, Equation (7)
    status: V
    flag: >-
      FS-stage overrun distribution applied to a PFS estimate; likely
      understates PFS cost risk; no source for PFS-to-FS estimate growth.
    sensitivity:
      - {label: "lognormal SD widened to 0.70, mean held at 0.35 (mu -1.854541, sigma 1.268636)", value: 0.70, source: judgment}
    decision: ADR 0015
    notes: >-
      The widened SD scales 0.42 by an assumed PFS-to-FS accuracy ratio of
      25/15, labelled as judgment until a page in AACE International
      Recommended Practice 47R-11 is verified. Applied to initial capital
      including contingency and to expansion capital; not to sustaining
      capital or closure. The build decision does not see the draw.

  - id: rampup.weight.series1
    description: Probability that a new plant ramps up along McNulty Series 1.
    distribution: {kind: fixed, value: 0.5609756}
    units: probability
    source: McNulty (1998), Mining Engineering 50(10):50-55
    location: Table 2, p. 53 (23 of 41 plants)
    status: V
    decision: ADR 0019 (all-plant weights are the sensitivity)
    notes: 23/41. Curve values in data/ramp_up_mcnulty_1998.csv.

  - id: rampup.weight.series2
    description: Probability that a new plant ramps up along McNulty Series 2.
    distribution: {kind: fixed, value: 0.1219512}
    units: probability
    source: McNulty (1998), Mining Engineering 50(10):50-55
    location: Table 2, p. 53 (5 of 41 plants)
    status: V
    decision: ADR 0019
    notes: 5/41.

  - id: rampup.weight.series3
    description: Probability that a new plant ramps up along McNulty Series 3.
    distribution: {kind: fixed, value: 0.1463415}
    units: probability
    source: McNulty (1998), Mining Engineering 50(10):50-55
    location: Table 2, p. 53 (6 of 41 plants)
    status: V
    decision: ADR 0019
    notes: 6/41.

  - id: rampup.weight.series4
    description: Probability that a new plant ramps up along McNulty Series 4.
    distribution: {kind: fixed, value: 0.1707317}
    units: probability
    source: McNulty (1998), Mining Engineering 50(10):50-55
    location: Table 2, p. 53 (7 of 41 plants)
    status: V
    decision: ADR 0019
    notes: 7/41. Three of the seven Series 4 plants closed within 36 months of startup (p. 52).

  - id: rampup.weight.oxide.series1
    description: >-
      Probability of McNulty Series 1 ramp-up for the hydrometallurgical oxide
      plant class (agitated or heap leaching of gold or copper oxide ores).
    distribution: {kind: fixed, value: 0.8571429}
    units: probability
    applies_to: {commodity: gold}
    source: McNulty (1998), Mining Engineering 50(10):50-55
    location: Tables 1 and 2, pp. 51 and 53 (6 of 7 hydrometallurgical oxide plants)
    status: V
    flag: McNulty (1998) Table 2 counts, 7 plants, plants built before 1998.
    sensitivity:
      - {label: all-plant weight (23/41), value: 0.5609756, source: "McNulty (1998), Table 2", status: V}
    decision: ADR 0019

  - id: rampup.weight.oxide.series2
    description: Probability of McNulty Series 2 ramp-up for the hydrometallurgical oxide class.
    distribution: {kind: fixed, value: 0.1428571}
    units: probability
    applies_to: {commodity: gold}
    source: McNulty (1998), Mining Engineering 50(10):50-55
    location: Tables 1 and 2, pp. 51 and 53 (1 of 7 hydrometallurgical oxide plants)
    status: V
    flag: McNulty (1998) Table 2 counts, 7 plants, plants built before 1998.
    sensitivity:
      - {label: all-plant weight (5/41), value: 0.1219512, source: "McNulty (1998), Table 2", status: V}
    decision: ADR 0019

  - id: timing.years_to_start.south_railroad
    description: >-
      Whole years from the South Railroad valuation date (2021-06-07) to the
      study's Year -1 (construction and pre-strip year), with no added delay.
    distribution: {kind: fixed, value: 4}
    units: years
    applies_to: {stage: PFS, jurisdiction: "Nevada, United States"}
    source: Council on Environmental Quality (June 12, 2020), Environmental Impact Statement Timelines (2010-2018)
    location: Figure 6, p. 13 (BLM median NOI to ROD 3.79 years, 143 EISs); Figure 5, p. 9 (BLM mean 4.36)
    status: V
    flag: >-
      On-schedule permitting assumption. CEQ figures cover all EIS types, not
      mines. BLM median rounded to whole years; time before the Notice of Intent
      and from the Record of Decision to construction set to zero; the FS is
      assumed to run alongside the EIS.
    sensitivity:
      - {label: "3 years (optimistic)", value: 3, source: judgment}
      - {label: "5 years (BLM mean plus time before the Notice of Intent)", value: 5, source: judgment}
    decision: ADR 0023
    notes: >-
      The 2020 PFS gives no calendar schedule (s. 1.11, p. 1-17; s. 26). Dates
      published after the valuation date are used only for outcome tracking.

  - id: timing.years_to_start.osino_twin_hills
    description: >-
      Whole years from the Osino valuation date (2023-07-13) to the DFS Year 0
      (all initial capital), with no added delay.
    distribution: {kind: fixed, value: 1}
    units: years
    applies_to: {stage: FS, jurisdiction: Namibia}
    source: Twin Hills DFS, NI 43-101 technical report (Lycopodium, June 2023)
    location: Section 25, p. 25.16 (funding by January 2024; FEED four to five months; first gold within 24 months)
    status: V
    flag: Company guidance as published on or before the valuation date.
    sensitivity:
      - {label: "0 years (the study as published)", value: 0, source: judgment}
      - {label: "2 years", value: 2, source: judgment}
    decision: ADR 0023

  - id: build.hurdle
    description: >-
      NPV the fixed build rule requires: after-tax NPV at the study's own
      discount rate, the path's real gold price held flat, study capital (never
      the overrun draw), including the study's tax and royalty burden.
    distribution: {kind: fixed, value: 0.0}
    units: case money units
    source: judgment
    location: ADR 0023, item 4
    status: J
    flag: Fixed build rule; hurdle and decision rate are judgment.
    sensitivity:
      - {label: "decision rate 8.9% in place of the study rate (CIM FS-stage gold real rate, used as a stricter hurdle)", value: 0.089, source: "Smith (2013), CIM Mineral Economics survey, via Lopatnikov and Rumyantsev (2025)", status: V}
    decision: ADR 0023

  - id: build.window_years
    description: >-
      Years after the build-ready year in which the fixed rule may still build.
      Paths not built by then are not built, and advance royalties stop.
    distribution: {kind: fixed, value: 5}
    units: years
    source: judgment
    location: ADR 0023, item 4
    status: J
    flag: >-
      Build window is judgment. Outputs show the share of paths that reach the
      end of the window and the share of royalty value from advance royalties.
    sensitivity:
      - {label: "10 years", value: 10, source: judgment}
    decision: ADR 0023

  - id: market.convenience_yield.gold
    description: >-
      Gold convenience yield (lease rate) in the market-consistent drift. The
      same value is used for the target and for every gold control (ADR 0024).
    distribution: {kind: fixed, value: 0.0}
    units: fraction per year
    source: judgment
    location: ADR 0024, item 2
    status: J
    flag: >-
      Gold lease rate set to zero; not yet checked against COMEX futures for the
      valuation dates. The cost of delay to a royalty holder is the buyer's
      spread plus this yield.
    sensitivity:
      - {label: "1% a year", value: 0.01, source: judgment}
    decision: ADR 0024

  - id: equity.issue_discount
    description: >-
      Discount of the operator's equity issue price to fair value when it raises
      the equity-funded part of initial capital (WP 1.8).
    distribution: {kind: fixed, value: 0.1054}
    units: fraction of fair value
    source: Carpentier and Suret (2009), Private Placements by Small Public Entities - Canadian Experience, CIRANO 2009s-12
    location: Table 6, p. 31 (3,476 placements, 1993 to 2003; mean 10.54%, median 9.09%; discount to the price 10 trading days after announcement)
    status: V
    flag: Canadian small-company private placements, 1993 to 2003, not mining-specific. Underwriting fees not modelled.
    sensitivity:
      - {label: "median 9.09%", value: 0.0909, source: "Carpentier and Suret (2009), Table 6, p. 31", status: V}
      - {label: "15% (developer bought deals)", value: 0.15, source: judgment}
    decision: ADR 0030

  - id: equity.debt_fraction
    description: Share of the study's initial capital estimate funded by debt at fair value.
    distribution: {kind: fixed, value: 0.0}
    units: fraction of initial capital
    source: judgment
    location: ADR 0030, item 2
    status: J
    flag: >-
      Dilution upper bound (all-equity funding); understates equity value and
      pushes developer-adapter implied odds higher.
    sensitivity:
      - {label: "30% debt", value: 0.30, source: judgment}
      - {label: "60% debt", value: 0.60, source: judgment}
    decision: ADR 0030
