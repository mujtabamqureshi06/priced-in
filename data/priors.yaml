# Priors registry. Every assumption the engine uses, with its source and status.
# Schema and rules: src/pricedin/priors.py. Status codes: docs/sources.md.
# Entries are added only with a source and a location; see docs/calibration.md.

priors:
  - id: stage.pfs_to_fs
    description: Probability that a project at PFS stage advances to a feasibility study.
    distribution: {kind: fixed, value: 0.82}
    units: probability
    applies_to: {stage: PFS}
    source: Sykes and Trench (2014), as reported in Lopatnikov and Rumyantsev (2025)
    location: Lopatnikov and Rumyantsev (2025), Mining Science and Technology 10(3), Table 1
    status: V
    flag: >-
      Cross-sectional count ratio, global copper; used as a stand-in for a
      conversion rate.
    sensitivity:
      - {label: stress low, value: 0.50, source: judgment}
      - {label: stress high, value: 0.95, source: judgment}
    decision: ADR 0013
    notes: >-
      Ratio of project counts at PFS and FS at one point in time (92 and 75),
      not a tracked conversion rate.

  - id: stage.fs_to_build
    description: >-
      Probability that a project at FS stage reaches a construction decision.
      One combined gate covering permitting, financing and the decision itself.
    distribution: {kind: fixed, value: 0.88}
    units: probability
    applies_to: {stage: FS}
    source: Sykes and Trench (2014), as reported in Lopatnikov and Rumyantsev (2025)
    location: Lopatnikov and Rumyantsev (2025), Mining Science and Technology 10(3), Table 1
    status: V
    flag: >-
      Cross-sectional count ratio, global copper; used as a stand-in for a
      conversion rate. Applied unchanged to permitted or financed cases, which
      probably understates their odds.
    sensitivity:
      - {label: AMC failure rate, value: 0.75, source: "AMC (McCarthy), Why feasibility studies fail", status: P}
      - {label: stress low, value: 0.50, source: judgment}
      - {label: stress high, value: 0.95, source: judgment}
    decision: ADR 0013
    notes: >-
      Ratio of producing or constructing projects (66) to FS-stage projects (75)
      at one point in time. Replaced by the Phase 4 cohort when available.
