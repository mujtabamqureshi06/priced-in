name: Website

# Builds the website from the engine and publishes it to GitHub Pages. Every figure on
# the page is computed here, from this commit, by scripts/export_site_example.py.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/export_site_example.py"
      - "src/**"
      - "data/priors.yaml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Export the example mine from the engine
        run: uv run python scripts/export_site_example.py
      - name: Build the site
        run: uv run python site/build.py
      - name: Check the page against the export
        run: uv run pytest -q --no-cov tests/test_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
