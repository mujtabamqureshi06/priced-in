# Case input template (schema: src/pricedin/inputs.py; worked example: south_railroad.yaml).
#
# Rules
# - One case = one project as of one valuation date (as_of). Only documents dated on or
#   before as_of may be listed (no look-ahead, ADR 0007).
# - Every number carries a source: a document id from `documents` plus a location
#   (section, table, page). A reader must be able to find each value in the report.
# - Enter money in the report's own units and say so in the column name (_usd_k for
#   US$ thousands). Do not convert while transcribing.
# - Schedule mode: copy the report's annual cash-flow table row by row, including the
#   report's own total for each row. The loader rejects a row whose values do not add up
#   to the stated total, and the tests require the table to reproduce the study NPV.
# - Required schedule columns: payable_gold_koz, initial_capex_usd_k,
#   cash_flow_pre_tax_usd_k, cash_flow_after_tax_usd_k. Add the cost, capex, working
#   capital and tax rows the report shows so the cash-flow identity can be checked.
# - Third-party documents are never committed; the url field points to the public copy.

id:                     # lower_snake_case, unique
name:
operator:               # operator on the as_of date
jurisdiction:
commodity:              # gold in Phase 1 (ADR 0006)
currency:               # ISO code of the study's cash flows, e.g. USD
as_of:                  # valuation date, YYYY-MM-DD
operator_share:         # fraction owned by the operator, 0 to 1

documents:              # list of {id, title, issuer, date, url}

study:
  stage:                # PEA | PFS | FS | construction | producing
  document:             # id of the study document
  effective_date:
  price_deck:           # commodity -> {value, units, source}
  discount_rate:        # {value (fraction), units, source}
  npv_pre_tax_usd_k:    # {value, units, source}
  npv_after_tax_usd_k:
  irr_after_tax:
  discounting:          # {t0_column (period discounted with exponent 0), convention: end_of_year, source}
  tax_summary:          # one paragraph, with section references

status:                 # {permitted, financed, construction_decision, source}

schedule:
  periods:              # the report's own period labels, in order
  columns:              # name -> {values (one per period), total (report's own), source}

royalties:              # list of {holder, kind (NSR|GRR|NPI|stream), rate, coverage_fraction,
                        #   advance_minimum_per_year (optional), advance_minimum_credited (true|false|null), notes}

notes:
