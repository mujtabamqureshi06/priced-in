notes: >-
  Silver revenue is net of the 2020 silver stream with Orion (all silver delivered for
  15% of the spot price; GSV Q1 2022 statements, Note 6), so the stream is already in
  the cash flow. Years 13 to 15 of Table 22-7 are zero and are not transcribed. Year 9
  to Year 12 carry residual leaching, closure and working-capital flows. A change in
  gold price changes tax in the same year; the study pays tax a year later, a small
  timing difference measured against Table 22-6 in tests/test_south_railroad_fs2022.py.
