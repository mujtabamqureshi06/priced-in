# South Railroad (Nevada, gold), valued as of Orla Mining's offer for Gold Standard Ventures.
# Schedule mode: the feasibility study's detailed financial model, Table 22-7, transcribed
# row by row. Money in US$ thousands, real (flat price deck, no escalation; FS Section 22.5).
# Valuation date: the close before the offer was announced (June 10, 2022). No look-ahead
# (ADR 0007): only documents public on that date are used. The offer itself is read by
# scripts/gsv_takeover.py.

