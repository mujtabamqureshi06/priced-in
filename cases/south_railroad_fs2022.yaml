    silver: {value: 21.50, units: US$/oz, source: {document: fs_2022, location: "Section 22.5; Table 22-7, Metal Prices"}}
  discount_rate: {value: 0.05, units: fraction per year, source: {document: fs_2022, location: "Table 22-5, p. 22-5"}}
  npv_pre_tax: {value: 388866, units: US$ thousands, source: {document: fs_2022, location: "Table 22-7, Financial Indicators Before-Taxes"}}
  npv_after_tax: {value: 314791, units: US$ thousands, source: {document: fs_2022, location: "Table 22-7, Financial Indicators After-Taxes"}}
  irr_after_tax: {value: 0.443, units: fraction per year, source: {document: fs_2022, location: "Table 22-5, p. 22-5"}}
  discounting:
    t0_column: "Year -1"
    convention: mid_year
    source: {document: fs_2022, location: "Section 22.14 (mid-year method); Year -1 at t = 0 and Year k at k - 0.5 reproduce all four NPVs in Table 22-7 to within US$1 thousand"}
  marginal_tax_rate:
    value: 0.195
    units: fraction of change in pre-tax profit
    source: {document: fs_2022, location: "Fitted to Table 22-6, p. 22-5: reproduces the after-tax NPV at US$1,400, 1,500, 1,800 and 1,899 to within US$0.6 million. The statutory rates in Sections 22.10 and 22.11 give 0.258, which does not reproduce the table (ADR 0043)"}
  tax_summary: >-
    Nevada excise tax 0.75% of gross revenue between US$20 million and US$150 million a
    year and 1.10% above; Nevada net proceeds tax 5% of revenue less excise tax,
    operating cost and depreciation; federal corporate tax 21%; no state income tax;
    7-year MACRS depreciation; all-equity financed (Sections 22.7, 22.10 to 22.13).
    Cash taxes are paid one year after the year they accrue (Table 22-7).

