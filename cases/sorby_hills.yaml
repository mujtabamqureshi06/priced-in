royalty:
  holder: Vox Royalty Corp. (agreement; completion pending FIRB approval)
  kind: NSR
  rate: {value: 0.0075, units: fraction of net smelter return, source: {document: vox_2026, location: "Opening paragraph: effective 0.75% NSR"}}
  coverage_fraction: {value: 1.0, units: fraction of the FEED schedule, source: {document: vox_2026, location: "Royalty covers the tenements that host these deposits and targets"}}
  price: {value: 13.0, units: US$ millions, source: {document: vox_2026, location: "Consideration and conditions precedent"}}
  metals: [lead, silver]
  deductions: [lead_treatment, silver_refining]
  notes: >-
    The release does not say which metals the royalty covers or explain "effective". Boab
    discloses a 1% NSR to Quintana MH Holding Company LLC from the original acquisition
    (boab_hy_2026, Note 14), metals not stated; 1% on the 75% interest Boab then held would
    give an effective 0.75%. That reconciliation is an inference (ADR 0035).
