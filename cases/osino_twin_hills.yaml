notes: >-
  Two inconsistencies inside the DFS. (1) Capex timing: Section 22.2 says US$100M
  is spent in Year -1 and US$265M in Year 0, but Table 22.3.2 places all US$365M in
  Year 0 at a discount factor of 1.00. The table reproduces the published NPV5
  (US$480M after tax); the split timing would give about US$452M. The table is
  used. (2) IRR: Table 22.3.2 states a post-tax IRR of 33%, which the table's cash
  flows reproduce; Table 22.4.1 and the June 12, 2023 release state 28%. The
  summary figure is recorded above as published; the table is the basis for
  reconciliation. Also, the table's pre-tax free cash flow is not fully explained
  by the rows shown: the residual is +10.7 in Year 1 and -5.9 and -7.0 in Years 12
  and 13 (US$M) and nets to about zero over life, consistent with working-capital
  movements. The table labels contingency "@ 15%" while note 4 and Table 22.3.1
  give 9.8% of construction capital; the US$34M amount is consistent in both.
