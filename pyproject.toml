[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pricedin"
version = "1.0.0"
description = "Simulation engine for undeveloped mining assets that backs out the build odds and timing implied by market prices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Mujtaba Moeen" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]
validation = [
    "QuantLib>=1.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pricedin"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# The page template keeps each HTML element on one line; the copy uses U+2212 and U+00F7.
"site/build.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "site/build.py", "scripts/export_site_example.py"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=pricedin --cov-report=term-missing"
